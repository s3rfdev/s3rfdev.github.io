<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Aurora &amp; Skies 3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0709"/><stop offset="1" stop-color="#240a0d"/>
    </linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/><stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g><ellipse cx="198.77" cy="314.6" rx="515.71" ry="224.37" fill="#ff8a5b" opacity="0.45" filter="url(#soft)" transform="rotate(156.28 198.77 314.6)"/><ellipse cx="1293.44" cy="654.2" rx="318.96" ry="395.82" fill="#ffd166" opacity="0.43" filter="url(#soft)" transform="rotate(90.77 1293.44 654.2)"/><ellipse cx="1325" cy="229.64" rx="193.94" ry="124.8" fill="#240a0d" opacity="0.5" filter="url(#soft)" transform="rotate(178.6 1325 229.64)"/><ellipse cx="653.71" cy="927.73" rx="266.89" ry="326.61" fill="#ff8a5b" opacity="0.38" filter="url(#soft)" transform="rotate(145.43 653.71 927.73)"/><ellipse cx="1178.55" cy="831" rx="316.67" ry="257.19" fill="#ffd166" opacity="0.41" filter="url(#soft)" transform="rotate(15.51 1178.55 831)"/><ellipse cx="844.47" cy="477.03" rx="168.74" ry="219.98" fill="#240a0d" opacity="0.32" filter="url(#soft)" transform="rotate(94.32 844.47 477.03)"/><ellipse cx="1113.29" cy="181.58" rx="265.05" ry="240.37" fill="#ff8a5b" opacity="0.48" filter="url(#soft)" transform="rotate(28 1113.29 181.58)"/></g>
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
