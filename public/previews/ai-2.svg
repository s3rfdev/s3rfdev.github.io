    </filter>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/><stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g><ellipse cx="1033.08" cy="488.55" rx="410.19" ry="377.08" fill="#ffb347" opacity="0.4" filter="url(#soft)" transform="rotate(125.42 1033.08 488.55)"/><ellipse cx="1377.38" cy="88.9" rx="216.07" ry="315.64" fill="#ff6b6b" opacity="0.47" filter="url(#soft)" transform="rotate(28.82 1377.38 88.9)"/><ellipse cx="408.35" cy="186.63" rx="386.65" ry="324.25" fill="#2b1408" opacity="0.63" filter="url(#soft)" transform="rotate(120.66 408.35 186.63)"/><ellipse cx="1474.89" cy="165.18" rx="536.37" ry="314.06" fill="#ffb347" opacity="0.42" filter="url(#soft)" transform="rotate(157.84 1474.89 165.18)"/><ellipse cx="1096.96" cy="564.28" rx="366.54" ry="112.73" fill="#ff6b6b" opacity="0.34" filter="url(#soft)" transform="rotate(36.37 1096.96 564.28)"/><ellipse cx="1325.47" cy="353.11" rx="276.46" ry="266.54" fill="#2b1408" opacity="0.33" filter="url(#soft)" transform="rotate(48.59 1325.47 353.11)"/><ellipse cx="704.12" cy="144.24" rx="536.17" ry="286.9" fill="#ffb347" opacity="0.48" filter="url(#soft)" transform="rotate(0.37 704.12 144.24)"/></g>
  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
