  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#soft)"><ellipse cx="839.36" cy="109.21" rx="478.65" ry="410.13" fill="#ff8a5b" opacity="0.45"/><ellipse cx="507.8" cy="80.33" rx="341.68" ry="368.03" fill="#ff8a5b" opacity="0.45"/><ellipse cx="713.56" cy="109.58" rx="464.52" ry="237.84" fill="#240a0d" opacity="0.31"/><ellipse cx="1048.83" cy="738.94" rx="755.35" ry="374.78" fill="#ff8a5b" opacity="0.56"/><ellipse cx="770.29" cy="246.8" rx="507.42" ry="184.81" fill="#ffd166" opacity="0.3"/></g>
  <g opacity="0.5"><path d="M0 720 Q 480 500 880 700 T 1600 620 L 1600 1000 L 0 1000 Z" fill="#5c1220" opacity="0.55"/></g>
